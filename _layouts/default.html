<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    
{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    {% include head-custom.html %}
    
</head>
<body>
    <script>
        try {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
        } catch (e) {}
    </script>
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m.386-6.364 1.591 1.591M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/>
        </svg>
    </button>
    <div class="wrapper">
        <header>
            <h1>{{ site.title }}</h1>
            <p>{{ site.description }}</p>
            <p class="sidebar">{% include sidebar.html %}</p>
        </header>
        
        <section>

            {{ content }}
        
        </section>
        
    <footer>
        <p>&copy; {{ site.time | date: '%Y' }} | <a href="https://github.com/aligheshlaghi97/asynchronous-python"
                                                        target="_blank">View on GitHub</a></p>
        <p>
            <a href="https://github.com/aligheshlaghi97/asynchronous-python/stargazers">
                <img alt="GitHub stars" src="https://img.shields.io/github/stars/aligheshlaghi97/asynchronous-python?style=social">
            </a>
            <a href="https://github.com/aligheshlaghi97/asynchronous-python/network/members">
                <img alt="GitHub forks" src="https://img.shields.io/github/forks/aligheshlaghi97/asynchronous-python?style=social">
            </a>
        </p>
    </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
    <script src="{{ "/assets/js/theme.js" | relative_url }}"></script>
</body>
</html>
